<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Goship123">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B2A44"/>
      <stop offset="45%" stop-color="#071422"/>
      <stop offset="100%" stop-color="#0A3A5C"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity=".9"/>
      <stop offset="50%" stop-color="#0098EA" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity=".75"/>
    </linearGradient>
    <linearGradient id="waveA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0098EA"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="waveB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0F6FF"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
    <radialGradient id="glow" cx="32" cy="26" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="0.55" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Premium tile + glass rim -->
  <rect width="64" height="64" rx="18" fill="url(#tile)"/>
  <rect x="1.2" y="1.2" width="61.6" height="61.6" rx="16.8" fill="none" stroke="url(#rim)" stroke-width="1.6"/>
  <circle cx="32" cy="26" r="22" fill="url(#glow)"/>
  <!-- Soft highlight -->
  <path d="M12 14c6-6 34-8 42 2-8-2-20 0-28 4-6 3-10 4-14 2z" fill="#fff" opacity=".08"/>
  <!-- Island -->
  <path d="M17 35c3.2-7 9-12 15-12s11.8 5 15 12c-4.2 1.2-9.4 2.2-15 2.2S21.2 36.2 17 35z" fill="#0E3A55"/>
  <path d="M25.5 28.2c1.4-2.6 3.5-4.2 6-4.2 1.6 0 3 .6 4.1 1.6-.9 1.8-2.5 3-4.6 3.5-1.9.4-3.8 0-5.5-.9z" fill="#14B8A6"/>
  <!-- Palm frond -->
  <path d="M37.2 27c2.6-3.2 6-4.2 8.2-3.6-1.8 1.3-2.8 2.9-3 4.6-2.2-.2-4-.5-5.2-1z" fill="#7DD3FC" opacity=".92"/>
  <!-- Delivery scooter mark -->
  <g filter="url(#soft)" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="23.8" cy="43.2" r="3.4" fill="none" stroke="url(#waveA)" stroke-width="1.85"/>
    <circle cx="40.2" cy="43.2" r="3.4" fill="none" stroke="url(#waveA)" stroke-width="1.85"/>
    <path d="M27 43.2h9.2M31.2 36.2h7.6c1.3 0 2.35.95 2.55 2.25L41.8 41H33.4l-2.2-4.8z" fill="none" stroke="url(#body)" stroke-width="1.75"/>
    <path d="M29.2 36.2h-3.8" stroke="#14B8A6" stroke-width="1.75"/>
    <circle cx="37.4" cy="34.4" r="1.45" fill="#0098EA"/>
    <!-- tiny package -->
    <rect x="33.6" y="33.2" width="3.2" height="2.4" rx=".4" fill="#7DD3FC" opacity=".95"/>
  </g>
  <!-- Dual waves -->
  <path d="M8 49c6 3.1 10 3.1 16 0s10-3.1 16 0 10 3.1 16 0" fill="none" stroke="url(#waveA)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M8 54.2c6 2.5 10 2.5 16 0s10-2.5 16 0 10 2.5 16 0" fill="none" stroke="url(#waveB)" stroke-width="1.7" stroke-linecap="round" opacity=".92"/>
</svg>
