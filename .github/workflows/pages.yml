name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble index.html from staging
        run: |
          set -euo pipefail
          if [ -s index.html.gz.b64 ]; then
            base64 -d index.html.gz.b64 | gzip -dc > index.html
            rm -f index.html.gz.b64
          elif ls index.html.gz.b64.* >/dev/null 2>&1; then
            cat $(ls index.html.gz.b64.* | sort -V) | base64 -d | gzip -dc > index.html
            rm -f index.html.gz.b64.*
          elif [ -d ._index_b64 ]; then
            cat ._index_b64/p* | base64 -d | gzip -dc > index.html
            rm -rf ._index_b64
          fi
          test -s index.html
          wc -c index.html
          # drop empty staging leftover
          if [ -f index.html.gz.b64 ] && [ ! -s index.html.gz.b64 ]; then
            rm -f index.html.gz.b64
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
