name: icon-stars
on:
  push:
    branches: [icon-seo-svg]
    paths:
      - .github/workflows/icon-stars.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: icon-seo-svg
      - name: Put stars back on rating buttons
        run: |
          python3 - << 'PY'
          import pathlib, gzip, base64
          files = sorted(pathlib.Path("._slices").glob("s*"))
          raw = b"".join(p.read_bytes() for p in files)
          html = gzip.decompress(base64.b64decode(raw)).decode()
          old = 'padding:2px"></button>'
          new = 'padding:2px">\u2605</button>'
          c = html.count(old)
          print("matches", c)
          if c != 1:
              raise SystemExit("unexpected count")
          html = html.replace(old, new, 1)
          out = gzip.compress(html.encode(), mtime=0)
          b64 = base64.b64encode(out).decode()
          assert gzip.decompress(base64.b64decode(b64)).decode()==html
          for p in files:
              p.unlink()
          d = pathlib.Path("._slices")
          for i in range(0, len(b64), 1500):
              (d / f"s{i:05d}").write_text(b64[i:i+1500])
          print("ok")
          PY
          rm -f .github/workflows/icon-stars.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore star glyphs on driver rating buttons"
          git push origin HEAD:icon-seo-svg
