name: icon-pass
on:
  push:
    branches: [icon-seo-svg]
    paths:
      - .github/workflows/icon-pass.yml
permissions:
  contents: write
concurrency:
  group: icon-pass
  cancel-in-progress: false
jobs:
  pass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: icon-seo-svg
      - name: Recode icons and tighten SEO
        run: |
          set -euo pipefail
          cat $(ls ._slices/s* | sort) | base64 -d | gzip -dc > /tmp/work.html
          python3 << 'PY'
          import pathlib, re, gzip, base64, collections
          p = pathlib.Path("/tmp/work.html")
          html = p.read_text(encoding="utf-8")
          report = []
          PATHS = {
            "scooter": '<circle cx="6.2" cy="17.2" r="2.15"/><circle cx="17.2" cy="17.2" r="2.15"/><path d="M8.4 17.2h6.2M4.8 17.2h1.1l1.4-4.8h5.2l1.3 2.8h4.6"/>',
            "car": '<path d="M4 16.2h16"/><path d="M6.2 16.2 7.6 12.1A1.5 1.5 0 0 1 9 10.8h6a1.5 1.5 0 0 1 1.45 1.1L17.8 16.2"/><path d="M5 16.2v2M19 16.2v2"/>',
            "van": '<path d="M3.8 16.2V8.8h8.2v7.4"/><path d="M12 11.2h4l3.2 5"/><path d="M3.8 16.2h16.4"/><circle cx="7.2" cy="17.3" r="1.6"/><circle cx="16.6" cy="17.3" r="1.6"/>',
            "bowl": '<path d="M4 10h16v1.4a8 8 0 0 1-16 0V10z"/><path d="M8 10V6.5M12 10V5M16 10V7"/>',
            "bag": '<path d="M6.5 8h11l-.9 11H7.4L6.5 8z"/><path d="M9 8V6.2a3 3 0 0 1 6 0V8"/>',
            "box": '<path d="M3.5 8 12 4.2 20.5 8 12 11.8 3.5 8z"/><path d="M12 11.8V20M3.5 8v8L12 20l8.5-4V8"/>',
            "pin": '<path d="M12 21s6-5.1 6-10a6 6 0 1 0-12 0c0 4.9 6 10 6 10z"/><circle cx="12" cy="11" r="2"/>',
            "plane": '<path d="M3.2 11.6 21 5.2l-5.2 14.6-2.6-6.2z"/>',
            "phone": '<path d="M8 3.6h3l1.1 3.5-1.8 1.2a10 10 0 0 0 4.4 4.4l1.2-1.8 3.5 1.1v3A1.6 1.6 0 0 1 18.8 16.6 13.2 13.2 0 0 1 6.4 4.2 1.6 1.6 0 0 1 8 3.6z"/>',
            "lock": '<rect x="6" y="10.2" width="12" height="8.6" rx="1.5"/><path d="M8.4 10.2V8a3.6 3.6 0 0 1 7.2 0v2.2"/>',
            "cash": '<rect x="3.2" y="6.5" width="17.6" height="11" rx="1.6"/><circle cx="12" cy="12" r="2.1"/>',
            "chat": '<path d="M5 6h14v8.5H9.2L5 18V6z"/>',
            "check": '<circle cx="12" cy="12" r="8"/><path d="M8.4 12.2 11 14.8l4.8-5.2"/>',
            "ticket": '<path d="M4 8h16v2.6a2 2 0 1 0 0 4V18H4v-3.4a2 2 0 1 0 0-4V8z"/>',
            "map": '<path d="M9 5 4 7.2v11L9 16l6 2.2 5-2.2v-11L15 7.2 9 5z"/><path d="M9 5v11M15 7.2v11"/>',
            "sun": '<circle cx="12" cy="12" r="3.2"/><path d="M12 3.6v2M12 18.4v2M3.6 12h2M18.4 12h2M6 6l1.5 1.5M16.5 16.5 18 18M18 6l-1.5 1.5M7.5 16.5 6 18"/>',
            "cloud": '<path d="M7.6 17.4h8.6a3.4 3.4 0 0 0 .4-6.8 4.6 4.6 0 0 0-8.8 1.3 2.9 2.9 0 0 0-.2 5.5z"/>',
            "rain": '<path d="M7.6 14.6h8.6a3.4 3.4 0 0 0 .4-6.8 4.6 4.6 0 0 0-8.8 1.3 2.9 2.9 0 0 0-.2 5.5z"/><path d="M9 17l-.7 2M12 17l-.7 2M15 17l-.7 2"/>',
            "fog": '<path d="M5 9.5h14M5 13h14M7 16.5h10"/>',
            "storm": '<path d="M7.6 14h8.6a3.4 3.4 0 0 0 .4-6.8 4.6 4.6 0 0 0-8.8 1.3A2.9 2.9 0 0 0 7.6 14z"/><path d="M12 14.2 10.4 17.4h2.3L11.2 21"/>',
            "partly": '<circle cx="8.2" cy="8.6" r="2.3"/><path d="M8.2 4.6v1.1M4.2 8.6h1.1M11.1 8.6h1.1"/><path d="M10.2 17.2h6.8a2.7 2.7 0 0 0 .3-5.4 3.6 3.6 0 0 0-6.8.9 2.3 2.3 0 0 0-.3 4.5z"/>',
            "crosshair": '<circle cx="12" cy="12" r="3"/><path d="M12 3.8v2.6M12 17.6v2.6M3.8 12h2.6M17.6 12h2.6"/>',
            "alert": '<path d="M12 4.2 3.6 19.2h16.8L12 4.2z"/><path d="M12 9.6v4M12 16.4h.01"/>',
            "note": '<path d="M6 4.8h8.2L18 8.6V19a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V5.8a1 1 0 0 1 1-1z"/><path d="M14 4.8V9h4"/>',
            "send": '<path d="M4 12 20 5.2 15 19.4 11.2 13 4 12z"/>',
            "users": '<circle cx="9" cy="9" r="2.3"/><path d="M4.6 18.2c.5-2.3 2.4-3.5 4.4-3.5s3.9 1.2 4.4 3.5"/><circle cx="16.2" cy="9.6" r="1.8"/><path d="M15.2 14.6c1.2-.2 2.4.2 3.2 1.3"/>',
            "clock": '<circle cx="12" cy="12" r="8"/><path d="M12 8v4.4l2.8 1.8"/>',
            "inbox": '<path d="M4 6.2h16V18H4z"/><path d="M4 13.5h4.2l1.4 2.2h4.8l1.4-2.2H20"/>',
            "search": '<circle cx="10.5" cy="10.5" r="5.2"/><path d="M14.6 14.6 19 19"/>',
          }
          def svg(name, size=18):
              return ('<svg class="gsi" viewBox="0 0 24 24" width="%d" height="%d" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">%s</svg>' % (size, size, PATHS[name]))
          # ----- SEO -----
          old_title = "Goship123 \u2014 \u0110\u1eb7t \u0111\u1ed3 \u0103n, Xe \u00f4m, Mua h\u1ed9 Ph\u00fa Qu\u1ed1c | Kodeeboyzz"
          new_title = "Goship123 \u2014 Xe \u00f4m, \u0111\u1ed3 \u0103n v\u00e0 mua h\u1ed9 Ph\u00fa Qu\u1ed1c"
          old_desc = "Goship123 \u2014 \u0111\u1eb7t \u0111\u1ed3 \u0103n, xe \u00f4m, \u00f4 t\u00f4 4\u20137 ch\u1ed7, \u0111\u01b0a \u0111\u00f3n s\u00e2n bay v\u00e0 mua h\u1ed9 t\u1ea1i Ph\u00fa Qu\u1ed1c. Hotline 038 772 0750."
          new_desc = "G\u1ecdi xe \u00f4m, \u0111\u1eb7t \u0111\u1ed3 \u0103n, mua h\u1ed9 v\u00e0 \u0111\u00f3n ti\u1ec5n s\u00e2n bay \u1edf Ph\u00fa Qu\u1ed1c. Gi\u00e1 ch\u1ed1t tr\u01b0\u1edbc, 7:00\u201322:00. Hotline 038 772 0750."
          if old_title not in html:
              report.append("MISS title")
          html = html.replace(old_title, new_title, 1)
          if old_desc not in html:
              report.append("MISS description")
          html = html.replace(old_desc, new_desc, 1)
          html = html.replace(
              'content="\u0110\u1eb7t \u0111\u1ed3 \u0103n, xe \u00f4m, \u00f4 t\u00f4 4\u20137 ch\u1ed7, \u0111\u01b0a \u0111\u00f3n s\u00e2n bay v\u00e0 mua h\u1ed9 t\u1ea1i Ph\u00fa Qu\u1ed1c. Hotline 038 772 0750."',
              'content="%s"' % new_desc, 1)
          html = html.replace(
              'content="\u0110\u1eb7t \u0111\u1ed3 \u0103n, xe \u00f4m, \u00f4 t\u00f4 v\u00e0 mua h\u1ed9 t\u1ea1i Ph\u00fa Qu\u1ed1c. Hotline 038 772 0750."',
              'content="%s"' % new_desc, 1)
          html = html.replace(
              'content="Goship123 \u2014 \u0110\u1eb7t \u0111\u1ed3 \u0103n \u00b7 Xe \u00f4m \u00b7 Mua h\u1ed9 Ph\u00fa Qu\u1ed1c"',
              'content="%s"' % new_title)
          html = re.sub(r'\n<meta name="keywords" content="[^"]*">', "", html, count=1)
          html = html.replace('rel="canonical" href="./">', 'rel="canonical" href="https://vaultadidas-collab.github.io/goship-bi/">', 1)
          html = html.replace('property="og:url" content="./">', 'property="og:url" content="https://vaultadidas-collab.github.io/goship-bi/">', 1)
          if 'rel="apple-touch-icon"' not in html:
              html = html.replace(
                  '<link rel="icon" href="assets/logo.svg" type="image/svg+xml">',
                  '<link rel="icon" href="assets/logo.svg" type="image/svg+xml">\n<link rel="apple-touch-icon" href="assets/logo.svg">',
                  1)
          needle = '"name": "Goship123",'
          insert = '"name": "Goship123",\n  "url": "https://vaultadidas-collab.github.io/goship-bi/",\n  "image": "https://vaultadidas-collab.github.io/goship-bi/assets/logo.svg",'
          if needle in html and '"url": "https://vaultadidas-collab.github.io/goship-bi/"' not in html:
              html = html.replace(needle, insert, 1)
          # ----- calm decoration -----
          css = """
          /* icon pass: flat mark, no spinning badge, no floating orbs */
          #bgfx .orb{display:none!important}
          #bgfx{perspective:none!important}
          .logo{animation:none!important;background:transparent!important;box-shadow:none!important;width:44px;height:44px;border-radius:12px;transform:none!important}
          .logo::after,.logo .sat{display:none!important;animation:none!important;content:none!important}
          .logo img{width:44px;height:44px;display:block;border-radius:12px}
          header{animation:none!important}
          .svc.on .ic,.bslide .em,.vch .tik{animation:none!important}
          .fall,.spark,.bg3d{display:none!important}
          .gsi{display:inline-block;vertical-align:-.22em;flex:0 0 auto}
          .trust b{display:flex;justify-content:center;color:var(--reddark)}
          .wday .i{color:var(--reddark);line-height:0}
          .ava{display:grid;place-items:center;color:#fff}
          .sec-title .gsi,.mtitle .gsi{color:var(--red)}
          """
          html = html.replace("</style>", css + "\n</style>", 1) if html.count("</style>") else html
          # last style block is the one we edited earlier; replace the FINAL </style> instead if first was wrong
          # The file has a single </style> before </head>. If more, the first replace already hit the only main one.
          html = html.replace(
              '<div id="bgfx" aria-hidden="true"><div class="grad"></div><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>',
              '<div id="bgfx" aria-hidden="true"><div class="grad"></div></div>',
              1)
          if "orb o1" in html:
              report.append("MISS orb removal")
          # remove decorative flying emoji on the island map
          html = re.sub(r"<text[^>]*>\s*(?:<animateMotion[\s\S]*?</animateMotion>\s*)+(?:<animate[\s\S]*?</animate>\s*)*</text>", "", html)
          html = re.sub(r'<text class="lmk"[^>]*>[^<]*</text>', "", html)
          # ----- helper in the app script -----
          gsi_js = "function gsi(name,size){var P=%s;var s=size||18;return '<svg class=\"gsi\" viewBox=\"0 0 24 24\" width=\"'+s+'\" height=\"'+s+'\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">'+ (P[name]||'') +'</svg>';}" % (
              "{" + ",".join('\"%s\":%s' % (k, repr(v)) for k,v in PATHS.items()) + "}"
          )
          # repr() uses single quotes; the JS object needs double-quoted keys and single-quoted path strings is invalid if paths contain quotes.
          # Rebuild safely:
          import json
          gsi_js = (
              "function gsi(name,size){var P=" + json.dumps(PATHS, ensure_ascii=False) +
              ";var s=size||18;return '<svg class=\"gsi\" viewBox=\"0 0 24 24\" width=\"'+s+'\" height=\"'+s+'\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">'+(P[name]||'')+'</svg>';}"
          )
          pos = html.find("PAY_NAME")
          if pos < 0:
              raise SystemExit("PAY_NAME missing")
          start = html.rfind("<script", 0, pos)
          gt = html.find(">", start)
          html = html[:gt+1] + "\n" + gsi_js + "\n" + html[gt+1:]
          # vehicle / weather icon fields -> gsi() calls (before emoji strip)
          for emo, name in [("\U0001f6f5","scooter"),("\U0001f697","car"),("\U0001f690","van")]:
              html2, n = re.subn(r"ic\s*:\s*['\"]%s['\"]" % emo, "ic:gsi('%s',22)" % name, html)
              html = html2
              report.append("ic %s -> %s x%d" % (name, emo, n))
          weather_map = [
              ('if(c===0)return["\u2600\ufe0f","N\u1eafng \u0111\u1eb9p"];', 'if(c===0)return[gsi("sun",22),"N\u1eafng \u0111\u1eb9p"];'),
              ('if(c<=2)return["\U0001f324\ufe0f","\u00cdt m\u00e2y"];', 'if(c<=2)return[gsi("partly",22),"\u00cdt m\u00e2y"];'),
              ('if(c===3)return["\u2601\ufe0f","Nhi\u1ec1u m\u00e2y"];', 'if(c===3)return[gsi("cloud",22),"Nhi\u1ec1u m\u00e2y"];'),
              ('if(c<=48)return["\U0001f32b\ufe0f","S\u01b0\u01a1ng m\u00f9"];', 'if(c<=48)return[gsi("fog",22),"S\u01b0\u01a1ng m\u00f9"];'),
              ('if(c<=57)return["\U0001f326\ufe0f","M\u01b0a ph\u00f9n"];', 'if(c<=57)return[gsi("rain",22),"M\u01b0a ph\u00f9n"];'),
              ('if(c<=67)return["\U0001f327\ufe0f","M\u01b0a"];', 'if(c<=67)return[gsi("rain",22),"M\u01b0a"];'),
              ('if(c<=82)return["\U0001f327\ufe0f","M\u01b0a r\u00e0o"];', 'if(c<=82)return[gsi("rain",22),"M\u01b0a r\u00e0o"];'),
              ('if(c<=99)return["\u26c8\ufe0f","D\u00f4ng"];', 'if(c<=99)return[gsi("storm",22),"D\u00f4ng"];'),
              ('return["\U0001f324\ufe0f",""];', 'return[gsi("partly",22),""];'),
          ]
          # The file may use either escaped or real emoji. Do real-emoji replaces below.
          repls = [
              ('if(c===0)return["\u2600\ufe0f","N\u1eafng \u0111\u1eb9p"];', 'if(c===0)return[gsi("sun",22),"N\u1eafng \u0111\u1eb9p"];'),
          ]
          pairs = [
              ("\u2600\ufe0f", "sun", "N\u1eafng \u0111\u1eb9p"),
              ("\U0001f324\ufe0f", "partly", "\u00cdt m\u00e2y"),
              ("\u2601\ufe0f", "cloud", "Nhi\u1ec1u m\u00e2y"),
              ("\U0001f32b\ufe0f", "fog", "S\u01b0\u01a1ng m\u00f9"),
              ("\U0001f326\ufe0f", "rain", "M\u01b0a ph\u00f9n"),
              ("\U0001f327\ufe0f", "rain", "M\u01b0a"),
              ("\U0001f327\ufe0f", "rain", "M\u01b0a r\u00e0o"),
              ("\u26c8\ufe0f", "storm", "D\u00f4ng"),
          ]
          for emo, name, label in pairs:
              old = 'return["%s","%s"];' % (emo, label)
              new = 'return[gsi("%s",22),"%s"];' % (name, label)
              c = html.count(old)
              if c == 0:
                  # try without FE0F
                  old2 = 'return["%s","%s"];' % (emo.replace("\ufe0f",""), label)
                  c2 = html.count(old2)
                  report.append("weather %s count %d /nofe0f %d" % (label, c, c2))
                  if c2:
                      html = html.replace(old2, new)
              else:
                  html = html.replace(old, new)
                  report.append("weather %s x%d" % (label, c))
          html = html.replace('return["\U0001f324\ufe0f",""];', 'return[gsi("partly",22),""];')
          html = html.replace('return["\U0001f324",""];', 'return[gsi("partly",22),""];')
          # weather icon element uses textContent
          html2, n = re.subn(r"(querySelector\(\s*['\"]\.i['\"]\s*\))\.textContent", r"\1.innerHTML", html)
          html = html2
          report.append("weather .i textContent->innerHTML x%d" % n)
          # any .ic assigned via textContent should be HTML
          lines = html.splitlines()
          changed = 0
          out_lines = []
          for ln in lines:
              if ".ic" in ln and "textContent" in ln and "gsi" not in ln:
                  ln2 = ln.replace("textContent", "innerHTML")
                  if ln2 != ln:
                      changed += 1
                      report.append("line ic textContent: " + ln.strip()[:180])
                  out_lines.append(ln2)
              else:
                  out_lines.append(ln)
          html = "\n".join(out_lines)
          report.append("ic textContent lines changed %d" % changed)
          # leaflet bike marker
          old_bike = 'html:\'<div style="font-size:24px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))">\U0001f6f5</div>\''
          new_bike = 'html:\'<div style="line-height:0;color:#0369A1\">\'+gsi(\'scooter\',22)+\'</div>\''
          if old_bike not in html:
              report.append("MISS bikeIcon exact")
              # looser
              html2, n = re.subn(r"html:'<div style=\"font-size:24px;filter:drop-shadow\(0 2px 2px rgba\(0,0,0,\.4\)\)\">\U0001f6f5</div>'", "html:'<div style=\"line-height:0;color:#0369A1\">'+gsi('scooter',22)+'</div>'", html)
              html = html2
              report.append("bikeIcon loose x%d" % n)
          else:
              html = html.replace(old_bike, new_bike, 1)
              report.append("bikeIcon exact")
          # step icons inside templates or html
          def swap_span(html, inner, name):
              old = '<span class="ic2">%s</span>' % inner
              count = html.count(old)
              if not count:
                  report.append("MISS ic2 %s" % inner)
                  return html
              new_tpl = '<span class="ic2">${gsi(\'%s\',16)}</span>' % name
              new_html = '<span class="ic2">%s</span>' % svg(name, 16)
              idx = 0
              built = []
              while True:
                  i = html.find(old, idx)
                  if i < 0:
                      built.append(html[idx:])
                      break
                  prev = html[max(0,i-300):i]
                  bt = prev.rfind("`")
                  sq = prev.rfind("'")
                  dq = prev.rfind('"')
                  use_tpl = bt > sq and bt > dq
                  built.append(html[idx:i])
                  built.append(new_tpl if use_tpl else new_html)
                  idx = i + len(old)
              report.append("ic2 %s x%d" % (name, count))
              return "".join(built)
          html = swap_span(html, "\u2713", "check")
          html = swap_span(html, "\U0001f9d1\u200d\U0001f373", "bowl")
          html = swap_span(html, "\U0001f6f5", "scooter")
          html = swap_span(html, "\U0001f389", "check")
          # empty-state big icons that are innerHTML strings
          for emo, name in [("\U0001f41a","inbox"),("\U0001f980","search")]:
              old = '<span class="big">%s</span>' % emo
              new = '<span class="big">%s</span>' % "'+gsi('%s',36)+'" % name
              # only valid if the span sits in a single-quoted JS string. Detect per occurrence.
              count = html.count(old)
              if not count:
                  report.append("MISS big %s" % name)
                  continue
              idx = 0
              built = []
              while True:
                  i = html.find(old, idx)
                  if i < 0:
                      built.append(html[idx:]); break
                  prev = html[max(0,i-120):i]
                  bt = prev.rfind("`"); sq = prev.rfind("'"); dq = prev.rfind('"')
                  if bt > sq and bt > dq:
                      repl = '<span class="big">${gsi(\'%s\',36)}</span>' % name
                  elif sq > bt and sq > dq:
                      repl = '<span class="big\">' + "'+gsi('%s',36)+'" % name + "'</span>"
                      # fix: we're inside single quotes, close and reopen
                      repl = "<span class=\"big\">' + gsi('%s',36) + '</span>" % name
                  else:
                      repl = '<span class="big">%s</span>' % svg(name, 36)
                  built.append(html[idx:i]); built.append(repl); idx = i+len(old)
              html = "".join(built)
              report.append("big %s x%d" % (name, count))
          # static HTML icon-only slots
          statics = {
              '<div class="i">\u23f3</div>': '<div class="i">%s</div>' % svg("clock", 20),
              '<div class="ava">\U0001f916</div>': '<div class="ava">%s</div>' % svg("chat", 22),
              '<b>\U0001f512</b>': '<b>%s</b>' % svg("lock", 18),
              '<b>\U0001f4b5</b>': '<b>%s</b>' % svg("cash", 18),
              '<b>\U0001f916</b>': '<b>%s</b>' % svg("chat", 18),
              '<span class="pn">\U0001f4cc</span>': '<span class="pn">%s</span>' % svg("pin", 16),
          }
          for a,b in statics.items():
              c = html.count(a)
              report.append("static %s x%d" % (a[1:12], c))
              if c:
                  html = html.replace(a, b)
          html = html.replace('lb.textContent=en?"\U0001f310 VI":"EN"', 'lb.textContent=en?"VI":"EN"')
          html = html.replace("lb.textContent=en?\"\U0001f310 VI\":\"EN\"", 'lb.textContent=en?"VI":"EN"')
          # strip remaining emoji (UI leftovers + decorative). Keep VI copy.
          emoji_re = re.compile(r"[\U0001F300-\U0001FAFF\u2600-\u27BF\uFE0F\u200D]")
          # do not strip inside the gsi function's JSON (no emoji there)
          removed = collections.Counter(emoji_re.findall(html))
          html2, nsub = emoji_re.subn("", html)
          html = html2
          report.append("stripped emoji codepoints %d kinds, %d chars" % (len(removed), nsub))
