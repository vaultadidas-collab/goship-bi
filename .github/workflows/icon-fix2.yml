name: icon-fix2
on:
  push:
    branches: [icon-seo-svg]
    paths:
      - .github/workflows/icon-fix2.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: icon-seo-svg
      - name: Restore stars and send icon
        run: |
          set -euo pipefail
          python3 .github/fix2.py
          rm -f .github/fix2.py .github/workflows/icon-fix2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore rating stars and chat send icon"
          git push origin HEAD:icon-seo-svg
