name: icon-peek
on:
  push:
    branches: [icon-seo-svg]
    paths:
      - .github/workflows/icon-peek.yml
permissions:
  contents: write
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: icon-seo-svg
      - name: Peek rating and send markup
        run: |
          python3 - << 'PY'
          import pathlib, gzip, base64
          raw = b"".join(pathlib.Path(p).read_bytes() for p in sorted(pathlib.Path("._slices").glob("s*")))
          html = gzip.decompress(base64.b64decode(raw)).decode()
          for needle in ["rstars", "chatSend", "querySelector('.i')", "innerHTML=ic", ".textContent=ic"]:
              i = html.find(needle)
              print("##", needle, i)
              if i>=0:
                  print(html[max(0,i-80):i+500].replace("\n"," | ")[:700])
          print("STAR_CHAR", "\u2605" in html, "ESC", "\\u2605" in html)
          print("SEND_SVG", 'id="chatSend"' in html and 'chatSend" aria-label="G\u1eedi"><svg' in html)
          PY
          rm -f .github/workflows/icon-peek.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Remove icon peek workflow"
          git push origin HEAD:icon-seo-svg
